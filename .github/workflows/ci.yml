name: CI Test & Build Verification

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & Utility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite (Vitest)
        run: pnpm test

  build:
    name: Build & PWA Verification
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm postinstall

      - name: Build Application
        run: pnpm build

      - name: Verify Critical Build Artifacts
        run: |
          test -f .output/public/sw.js || (echo "Service Worker sw.js is missing!" && exit 1)
          test -f .output/public/offline.html || (echo "offline.html is missing!" && exit 1)
          test -f .output/server/index.mjs || (echo "Server bundle index.mjs is missing!" && exit 1)
          echo "All production build artifacts successfully verified!"
